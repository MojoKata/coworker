name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: the launcher, unattended as a client's CI runs it, into a throwaway home
        env:
          COWORKER_HOME: ${{ runner.temp }}/coworker
          COWORKER_UNATTENDED: "1"
        run: |
          bin/downloads list
          cat "$COWORKER_HOME/PROTOCOL"
          bin/vms list
          "$COWORKER_HOME/bin/deps" install
          bin/coworker status --no-network "$GITHUB_WORKSPACE"   # this checkout as a project: unattended, nothing may wait
